# CI: the full quality chain on every push (README §5.4). A red run does not get merged.
#
# Runs on every push to every branch. A pull request from a branch in this repo shows the
# result of its latest push, so a separate pull_request trigger would only run everything twice.
# `workflow_dispatch` adds a "Run workflow" button, e.g. after the baseline workflow committed
# new screenshots (commits made by a workflow do not start other workflows).
name: CI

on:
  push:
  workflow_dispatch:

# The workflow only reads the repo.
permissions:
  contents: read

# A newer push to the same branch cancels the older, still-running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Tells Playwright it runs in CI: visual tests switch on, `test.only` becomes an error.
      CI: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Bundle size
        run: npm run size

      # Browsers are ~500 MB, so they are cached between runs. The cache key changes when
      # package-lock.json does, which is when Playwright (and its browsers) may change.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps

      # With a cache hit, only the system libraries the browsers need are installed.
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps

      - name: End-to-end, accessibility and visual tests
        run: npm run e2e

      # GitHub's Ubuntu runners come with Google Chrome, which Lighthouse uses.
      - name: Lighthouse
        run: npm run lighthouse

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      # The Lighthouse reports are useful also when everything passes: they show the trend.
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: .lighthouse/
          retention-days: 14

# CI: the full quality chain on every push (README §5.4). A red run does not get merged.
#
# Runs on every push to every branch. A pull request from a branch in this repo shows the
# result of its latest push, so a separate pull_request trigger would only run everything twice.
# `workflow_dispatch` adds a "Run workflow" button, e.g. after the baseline workflow committed
# new screenshots (commits made by a workflow do not start other workflows).
name: CI

on:
  push:
  workflow_dispatch:

# The workflow only reads the repo.
permissions:
  contents: read

# A newer push to the same branch cancels the older, still-running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Tells Playwright it runs in CI: visual tests switch on, `test.only` becomes an error.
      CI: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # Kálmán's layers and turntable views are generated from the images in
      # docs/images/kalman-design/; cutting them again must change nothing (spec: kalman-rig,
      # "Layers come from the design images", scenario "Cutting again").
      - name: Check Kálmán's images are up to date
        run: npm run check:kalman

      # First the build that Cloudflare serves on production, proven free of the preview.
      - name: Build (production)
        run: npm run build

      - name: Check the production build
        run: npm run check:production

      # Then the build with the dev-only preview, which the tests below run against.
      # Its public pages are identical; it only adds /playground/.
      - name: Build (with preview)
        run: npm run build:playground

      - name: Bundle size (per page)
        run: npm run size

      # Browsers are ~500 MB, so they are cached between runs. The cache key changes when
      # package-lock.json does, which is when Playwright (and its browsers) may change.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # The download sometimes hangs instead of failing (seen on 2026-10-27), and then waits for
      # the 30-minute job timeout. `timeout 5m` stops a hung try (a normal install takes about
      # a minute) and the loop tries once more, like a `for attempt in range(2)` retry in Python.
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 12
        run: |
          for attempt in 1 2; do
            timeout 5m npx playwright install --with-deps && exit 0
            echo "::warning::Playwright install try $attempt failed or hung; trying again."
          done
          exit 1

      # With a cache hit, only the system libraries the browsers need are installed.
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps

      - name: End-to-end, accessibility and visual tests
        run: npm run e2e

      # GitHub's Ubuntu runners come with Google Chrome, which Lighthouse uses.
      - name: Lighthouse
        run: npm run lighthouse

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      # The Lighthouse reports are useful also when everything passes: they show the trend.
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: .lighthouse/
          # The folder name starts with a dot, which upload-artifact skips unless told otherwise.
          include-hidden-files: true
          retention-days: 14
